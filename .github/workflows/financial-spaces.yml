name: Financial spaces validation

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: financial-spaces-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      POSTGRES_URL: postgresql://fixture:unused@127.0.0.1:9/never_connect
      NEON_AUTH_BASE_URL: https://auth.example.test/neondb/auth
      NEON_AUTH_COOKIE_SECRET: fixture-ci-only-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:delivery
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth:render
      - run: npm run test:spaces:navigation
      - run: npm run test:spaces:selection
      - run: npm run test:spaces:verification
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build -- --webpack
      - run: npm audit --omit=dev

  postgres:
    name: PostgreSQL migrations and services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MES_FINANCES_TEST_BASELINE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:spaces:prepare
      - run: npm run test:spaces:services
      - run: npm run test:spaces:db

  required:
    name: Financial spaces required
    if: ${{ always() }}
    needs: [quality, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      POSTGRES_RESULT: ${{ needs.postgres.result }}
    steps:
      - run: test "$QUALITY_RESULT" = success && test "$POSTGRES_RESULT" = success
